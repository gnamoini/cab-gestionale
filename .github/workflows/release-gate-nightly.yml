# Tier-3 stability: soak extended + lint advisory (non-blocking).
name: Release Gate Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: release-gate-nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nightly:
    name: release-gate-nightly
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint (advisory)
        run: npm run lint
        continue-on-error: true

      - name: Full regression (advisory)
        run: npm run smoke:regression
        continue-on-error: true

      - name: Long-session soak extended
        run: npm run ops:long-session-soak -- --samples 4 --interval-ms 60000 > long-session-soak-nightly.log 2>&1
        continue-on-error: true

      - name: Performance trend report
        run: npm run ops:performance-trend-report
        continue-on-error: true

      - name: Upload soak artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-session-soak-nightly
          path: long-session-soak-nightly.log
          retention-days: 30

      - name: Upload performance trends
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-trends-nightly
          path: |
            test-results/performance-trends/**
            test-results/build-budget-snapshot.json
            docs/performance-governance-report.md
          retention-days: 90
          if-no-files-found: ignore
