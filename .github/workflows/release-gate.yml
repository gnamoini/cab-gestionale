# Unica autorità pre-production: questo workflow autorizza merge e deploy production.
# Vercel non esegue gate né production:check — solo next build dopo Deployment Protection.
name: Release Gate

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Fork PRs must not run with repository secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    env:
      PRODUCTION_CHECK_REQUIRE_DB: "1"
      CI: "true"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
      SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
      SMOKE_OPERATOR_EMAIL: ${{ secrets.SMOKE_OPERATOR_EMAIL }}
      SMOKE_OPERATOR_PASSWORD: ${{ secrets.SMOKE_OPERATOR_PASSWORD }}
      SMOKE_DOCUMENTI_LAVORAZIONE_ID: ${{ secrets.SMOKE_DOCUMENTI_LAVORAZIONE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript (tsc --noEmit)
        run: npm run ci:tsc

      - name: Next.js build
        run: npm run ci:build
        env:
          NODE_ENV: production

      # Full `npm run lint` è advisory in release-gate-nightly (~400 violazioni legacy).
      # Gate enforced: flex:eslint:gate + flex:freeze:gate (allineato a scripts/release-gate.ts).

      - name: RBAC regression tests
        run: npm run test:rbac

      - name: RBAC hardening tests
        run: npm run test:rbac:hardening

      - name: Security remediation regression
        run: npm run test:security:remediation

      - name: UX enforcement
        run: npm run ux:enforce

      - name: UI design audit
        run: npm run audit:ui

      - name: UX mobile gate
        run: npm run ux:mobile-gate

      - name: iOS static regression check
        run: npm run ios:check

      - name: Verify Supabase secrets present
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          echo "Supabase secrets present"

      - name: Verify Supabase connection
        run: npx tsx scripts/verify-supabase-ci-env.ts

      - name: Production readiness (RBAC, storage, pilot, legacy URLs)
        run: npm run production:check

      - name: Supabase realtime publication (sanity)
        run: npm run ci:supabase:publication
        env:
          PUBLICATION_CHECK_STRICT: "0"
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Smoke structural + regression tests (core tier)
        run: npm run smoke:structural && npm run smoke:regression:core

      - name: Flex ESLint gate
        run: npm run flex:eslint:gate

      - name: Flex system freeze gate
        run: npm run flex:freeze:gate

      - name: Release contract conformance
        run: npx tsx lib/control/release-ready-contract.test.ts

      - name: CI smoke preflight (fail-fast)
        run: npx tsx scripts/ci-smoke-preflight.ts --tier=pr

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke Playwright (runtime)
        run: npm run smoke:playwright
        env:
          PORT: "3210"
          SMOKE_BASE_URL: http://127.0.0.1:3210

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-pr-failure-${{ github.run_id }}
          path: |
            e2e/test-results/**
            e2e/playwright-report/**
          retention-days: 14
          if-no-files-found: ignore

      - name: Cleanup smoke test data
        if: always()
        run: SMOKE_CLEANUP_APPLY=1 npm run smoke:cleanup

  control-pr-shadow:
    name: control-pr-shadow
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    env:
      CI: "true"
      SMOKE_SKIP: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Control Plane governance review
        run: npm run control:review

      - name: Control Plane registry parity
        run: npm run control:parity

      - name: Regression classification
        run: npx tsx lib/control/regression-classification.test.ts

      - name: Control Plane local tier (shadow, no E2E)
        run: SMOKE_SKIP=1 npm run control:local
        env:
          CI: "true"

      - name: Legacy outcomes probe (shadow)
        run: npm run control:shadow-legacy-probe
        continue-on-error: true

      - name: Shadow policy (advisory)
        run: npm run control:shadow-policy
        continue-on-error: true

      - name: Shadow policy (strict, Fase B)
        if: env.CONTROL_SHADOW_STRICT == '1'
        run: npm run control:shadow-policy -- --strict

      - name: Upload control report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-report-shadow-${{ github.run_id }}
          path: |
            control-report.json
            shadow-policy-report.json
            legacy-outcomes.json
          retention-days: 30
          if-no-files-found: ignore
