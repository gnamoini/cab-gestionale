<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <dir>.</dir>
  <cachedir>/tmp/fontconfig-labels-cache</cachedir>
  <alias binding="strong">
    <family>LabelSans</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>LabelMono</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
</fontconfig>
