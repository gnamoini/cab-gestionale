# Tier-2 certification: extended regression + mobile E2E + publication full + soak threshold.
# Runs on push main, weekly schedule, and manual dispatch.
name: Release Gate Cert

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: release-gate-cert-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cert:
    name: release-gate-cert
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: "true"
      PRODUCTION_CHECK_REQUIRE_DB: "1"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
      SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
      SMOKE_OPERATOR_EMAIL: ${{ secrets.SMOKE_OPERATOR_EMAIL }}
      SMOKE_OPERATOR_PASSWORD: ${{ secrets.SMOKE_OPERATOR_PASSWORD }}
      SMOKE_DOCUMENTI_LAVORAZIONE_ID: ${{ secrets.SMOKE_DOCUMENTI_LAVORAZIONE_ID }}
      PUBLICATION_CHECK_STRICT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Extended regression tier
        run: npm run smoke:regression:extended

      - name: Supabase inventory (advisory)
        run: npm run audit:supabase
        continue-on-error: true

      - name: Supabase realtime publication (full)
        run: npm run ci:supabase:publication:full

      - name: Long-session soak threshold
        run: npm run ops:long-session-soak:threshold

      - name: Next.js build (Playwright runtime)
        run: npm run ci:build
        env:
          NODE_ENV: production

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Scheda Ingresso mobile cert (spec 13)
        run: npm run smoke:playwright:cert
        env:
          PORT: "3210"
          SMOKE_BASE_URL: http://127.0.0.1:3210

      - name: Nuovo Ricambio mobile cert (spec 14)
        run: npm run smoke:playwright:ricambio:cert
        env:
          PORT: "3210"
          SMOKE_BASE_URL: http://127.0.0.1:3210

      - name: Smoke residue audit (advisory)
        run: npm run audit:smoke:residues
        continue-on-error: true

      - name: Cleanup smoke test data
        if: always()
        run: SMOKE_CLEANUP_APPLY=1 npm run smoke:cleanup
