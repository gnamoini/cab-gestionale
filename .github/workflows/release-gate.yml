# Unica autorità pre-production: questo workflow autorizza merge e deploy production.
# Vercel non esegue gate né production:check — solo next build dopo Deployment Protection.
name: Release Gate

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Fork PRs must not run with repository secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    env:
      PRODUCTION_CHECK_REQUIRE_DB: "1"
      CI: "true"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
      SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
      SMOKE_OPERATOR_EMAIL: ${{ secrets.SMOKE_OPERATOR_EMAIL }}
      SMOKE_OPERATOR_PASSWORD: ${{ secrets.SMOKE_OPERATOR_PASSWORD }}
      SMOKE_DOCUMENTI_LAVORAZIONE_ID: ${{ secrets.SMOKE_DOCUMENTI_LAVORAZIONE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript (tsc --noEmit)
        run: npm run ci:tsc

      - name: Next.js build
        run: npm run ci:build
        env:
          NODE_ENV: production

      - name: UX enforcement
        run: npm run ux:enforce

      - name: UX mobile gate
        run: npm run ux:mobile-gate

      - name: iOS static regression check
        run: npm run ios:check

      - name: Verify Supabase secrets present
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          echo "Supabase secrets present"

      - name: Verify Supabase connection
        run: npx tsx scripts/verify-supabase-ci-env.ts

      - name: Production readiness (RBAC, storage, pilot, legacy URLs)
        run: npm run production:check

      - name: Supabase realtime publication (sanity)
        run: npm run ci:supabase:publication
        env:
          PUBLICATION_CHECK_STRICT: "0"
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Smoke structural + regression tests (core tier)
        run: npm run smoke:structural && npm run smoke:regression:core

      - name: Flex ESLint gate
        run: npm run flex:eslint:gate

      - name: Flex system freeze gate
        run: npm run flex:freeze:gate

      - name: CI smoke preflight (fail-fast)
        run: npx tsx scripts/ci-smoke-preflight.ts --tier=pr

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke Playwright (runtime)
        run: npm run smoke:playwright
        env:
          PORT: "3210"
          SMOKE_BASE_URL: http://127.0.0.1:3210

      - name: Scheda Ingresso desktop smoke (spec 13 full flow)
        run: npm run smoke:playwright:scheda-smoke
        env:
          PORT: "3210"
          SMOKE_BASE_URL: http://127.0.0.1:3210

      - name: Nuovo Ricambio E2E smoke (spec 14)
        run: npm run smoke:playwright:ricambio:smoke
        env:
          PORT: "3210"
          SMOKE_BASE_URL: http://127.0.0.1:3210

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-pr-failure-${{ github.run_id }}
          path: |
            e2e/test-results/**
            e2e/playwright-report/**
          retention-days: 14
          if-no-files-found: ignore

      - name: Cleanup smoke test data
        if: always()
        run: SMOKE_CLEANUP_APPLY=1 npm run smoke:cleanup
